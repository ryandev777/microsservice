_format_version: "3.0"

services:
  - name: games-service
    url: http://games:4001
    routes:
      - name: games-routes
        paths:
          - /games
        # false: both services expose their routes with the "/games" and
        # "/wallets" prefixes already included (e.g. GET /games/rounds/current,
        # POST /wallets), matching the README's documented API surface, so
        # Kong must forward the request path unchanged.
        strip_path: false

  - name: wallets-service
    url: http://wallets:4002
    routes:
      - name: wallets-routes
        paths:
          - /wallets
        # false: both services expose their routes with the "/games" and
        # "/wallets" prefixes already included (e.g. GET /games/rounds/current,
        # POST /wallets), matching the README's documented API surface, so
        # Kong must forward the request path unchanged.
        strip_path: false
